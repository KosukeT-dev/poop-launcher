<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>運呼バズーカ / POOP LAUNCHER</title>
  <style>
    :root {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1d2b53;
      font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none
    }

    #game {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #6fb7ff;
      box-shadow: 0 0 30px #0008
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    #lang {
      position: absolute;
      top: .5em;
      right: .5em;
      z-index: 5;
      display: flex;
      gap: 4px
    }

    #lang button {
      font-weight: 900;
      border: 3px solid #fff;
      border-radius: .9em;
      padding: .25em .75em;
      font-size: 1em;
      background: #0006;
      color: #fff;
      cursor: pointer
    }

    #fsb {
      display: flex;
      align-items: center;
      padding: .2em .45em !important
    }

    #fsb svg {
      width: 2em;
      height: 2em
    }

    #lang button.on {
      background: #ff6a2b
    }

    #hud {
      position: absolute;
      left: .5em;
      right: .5em;
      top: 3.2em;
      display: none;
      justify-content: space-around;
      color: #fff;
      font-weight: 900;
      font-size: 1.25em;
      text-shadow: 0 2px 0 #0007;
      pointer-events: none;
      z-index: 2
    }

    #hud b {
      font-size: 1.5em
    }

    #ov {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      text-align: center;
      z-index: 3;
      padding: 16px
    }

    h1 {
      margin: 0;
      line-height: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform: rotate(-4deg)
    }

    h1 .a {
      font-size: 2.5em;
      font-weight: 900;
      color: #ffd23f;
      -webkit-text-stroke: .2em #5b3a1a;
      paint-order: stroke fill;
      text-shadow: 0 .1em 0 #5b3a1a
    }

    h1 .b:empty {
      display: none
    }

    h1 .b {
      font-size: clamp(26px, 8vw, 48px);
      font-weight: 900;
      color: #ff7ab0;
      -webkit-text-stroke: 8px #5b3a1a;
      paint-order: stroke fill
    }

    .bt {
      font-size: 1.8em;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(#ff8a3d, #ff5a1f);
      border: 4px solid #fff;
      border-radius: 40px;
      padding: .3em 1.2em;
      box-shadow: 0 6px 0 #a63a0b;
      cursor: pointer
    }

    .bt:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #a63a0b
    }

    .pn {
      background: #fff;
      border: 5px solid #5b3a1a;
      border-radius: 24px;
      padding: .9em 1.3em;
      box-shadow: 0 8px 0 #0004;
      color: #5b3a1a;
      font-weight: 900;
      font-size: 1.3em;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center
    }

    .pn h2 {
      margin: 0;
      font-size: 1.4em;
      color: #e8481a
    }
  </style>
</head>

<body>
  <div id="game"><canvas id="c"></canvas>
    <div id="lang"><button id="fsb" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"
          stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" />
        </svg></button><button id="bj">JP</button><button id="be">EN</button></div>
    <div id="hud"></div>
    <div id="ov"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>

      en: { t1: 'POOP LAUNCHER', t2: '', start: 'START', stage: 'Stage', ammo: 'Ammo', left: 'Left:', unit: '', lf: '', next: 'Next', n: 'Normal', s: 'Soft', clear: 'Stage Clear!', nxt: 'NEXT STAGE', over: 'Game Over', retry: 'RETRY', score: 'Score', reach: 'Stage reached', soft: 'DIARRHEA!', big: 'HUGE!', hint: 'Drag to aim, release to fire!', nice: 'NICE!', great: 'GREAT!', amazing: 'AMAZING!' }
    };
    let L = (navigator.language || '').startsWith('ja') ? 'ja' : 'en', tx = () => T[L];
    const { Engine, Bodies, Composite, Body, Events } = Matter;

    let W, H, S, OX, OY, dpr;
    const gm = document.getElementById('game');
    function rs() {
      dpr = Math.min(devicePixelRatio || 1, 2); const fs = !!(document.fullscreenElement || document.webkitFullscreenElement), vw = innerWidth, vh = innerHeight;
      W = Math.floor(Math.min(fs ? vw : 485, vw, vh * .6)); H = Math.floor(W * 1000 / 600); cv.width = W * dpr; cv.height = H * dpr; S = W / 600; OX = 0; OY = 0;

    }
    addEventListener('resize', rs); document.addEventListener('fullscreenchange', rs); document.addEventListener('webkitfullscreenchange', rs); rs();
    /* audio */
    let ac; function au() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state == 'suspended') ac.resume() }
    function tone(f1, f2, d, ty = 'sine', v = .3) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), n = ac.createGain(); o.type = ty; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d); n.gain.setValueAtTime(v, t); n.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(n).connect(ac.destination); o.start(); o.stop(t + d) }
    function noise(d, f, v = .4) { if (!ac) return; const t = ac.currentTime, b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++)a[i] = Math.random() * 2 - 1; const s = ac.createBufferSource(); s.buffer = b; const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f; const n = ac.createGain(); n.gain.setValueAtTime(v, t); n.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(fl).connect(n).connect(ac.destination); s.start() }
    const sfx = { pop: () => tone(300, 800, .12), splat: () => { noise(.3, 600); tone(220, 60, .25, 'sawtooth', .15) }, boom: () => { noise(.5, 300, .6); tone(120, 30, .4, 'square', .3) }, ding: () => tone(500, 1100, .15, 'triangle', .2), ding2: n => tone(450 + Math.min(n, 10) * 80, 900 + Math.min(n, 10) * 120, .15, 'triangle', .18), win: () => { tone(400, 800, .2, 'triangle'); setTimeout(() => tone(600, 1200, .3, 'triangle'), 180) }, lose: () => tone(300, 70, .7, 'sawtooth', .2) };
    /* game */

    let eng, bullets = [], targets = [], parts = [], queue = [], ammo = 0, stage = 1, score = 0, state = 'title', aim = null, last = 0, kick = 0, ended = 0, curOv = null;
    const clouds = Array.from({ length: 7 }, (_, i) => ({ x: i * 150 - 200, y: 60 + Math.random() * 500, s: .6 + Math.random() * .9, v: .1 + Math.random() * .2 }));
    function layout(st) {
      const P = [];
      const pyr = (cx, rows) => { for (let r = 0; r < rows; r++) { const n = rows - r; for (let i = 0; i < n; i++)P.push([cx - (n - 1) * 29 + i * 58, r]) } };
      const wall = (cx, cols, rows) => { for (let r = 0; r < rows; r++) { const n = r % 2 ? cols - 1 : cols; for (let i = 0; i < n; i++)P.push([cx - (cols - 1) * 29 + i * 58 + (r % 2 ? 29 : 0), r]) } };

    }
    function setup() {

      const LY = layout(stage), cnt = LY.length;

      state = 'play'; ended = 0; last = performance.now(); hide(); hud();
    }
    Events.on && 0;
    function left() { return targets.filter(t => !t.fallen).length }

      const t = tx(); hudEl.style.display = state == 'play' ? 'flex' : 'none';
      hudEl.innerHTML = `<span>${t.stage} <b>${stage}</b></span><span>${t.left} <b>${left()}</b>${t.unit}</span><span>${t.ammo} <b>${ammo}</b></span>`
    }
    function burst(x, y, n, cols, sp = 8) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, l: 1, r: 3 + Math.random() * 7, c: cols[i % cols.length] }) } }
    function getAim(p) {
      let dx = p.x - CX, dy = p.y - CY, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      if (uy > -.15) { uy = -.15; ux = Math.sign(ux || 1) * Math.sqrt(1 - .0225) }

    }
    function fire(p) {

    function wireEvents() { }

      lastP = { x: t.position.x, y: t.position.y }; combo++; dirty = 1; sfx.ding2(combo); burst(t.position.x, t.position.y, 8, ['#7a4a1c', '#ffd23f', '#fff'], 8)

    }

        b.rot = (b.rot || 0) + .25; const gone = b.gone || (b.soft && b.hit && now - b.hit > 900) || b.position.y > 1200 || b.position.y < -400 || b.position.x < -300 || b.position.x > 900 || now - b.born > 6000;

    }
    /* drawing */
    function dp(x, y, r, soft, a = 0, sx = 1, sy = 1, eyes = true) {

    function bazooka() {

      g.strokeStyle = '#7a2f35'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, -8); g.quadraticCurveTo(-3, 15, 0, 32); g.stroke();
      g.save(); g.translate(0, 50);
      g.fillStyle = '#b5555a'; g.strokeStyle = '#6e2a31'; g.lineWidth = 3; g.beginPath(); g.ellipse(0, 0, 24, 17, 0, 0, 7); g.fill(); g.stroke();
      g.strokeStyle = '#7a2f35'; g.lineWidth = 2; for (let k = 0; k < 12; k++) { const t = k / 12 * 6.283; g.beginPath(); g.moveTo(Math.cos(t) * 7, Math.sin(t) * 5); g.lineTo(Math.cos(t) * 22, Math.sin(t) * 15); g.stroke() }
      g.fillStyle = '#3a1020'; g.beginPath(); g.ellipse(0, 0, 6 + kick * 9, 4 + kick * 7, 0, 0, 7); g.fill();

    function draw() {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sk = g.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#4f8dff'); sk.addColorStop(.7, '#a9dcff'); sk.addColorStop(1, '#e8f8ff'); g.fillStyle = sk; g.fillRect(0, 0, W, H);

      g.fillStyle = '#6fd36a'; g.beginPath(); g.ellipse(300, 1080, 700, 200, 0, 0, 7); g.fill(); g.fillStyle = '#55bb55'; g.beginPath(); g.ellipse(120, 1010, 300, 70, 0, 0, 7); g.fill();
      if (state != 'title') {
        /* table */
        g.fillStyle = '#a0642a'; g.strokeStyle = '#4a2a0e'; g.lineWidth = 5;
        for (const x of [65, 535]) { g.beginPath(); g.roundRect(x - 14, 584, 28, 380, 6); g.fill(); g.stroke() }
        g.beginPath(); g.roundRect(40, TT, 520, 24, 8); g.fill(); g.stroke();
        g.fillStyle = '#c98543'; g.fillRect(46, TT + 3, 508, 6);
        for (const t of targets) { const p = ip(t); dp(p.x, p.y + 3, 25, false, p.a) }
      }
      if (sh) { g.fillStyle = '#c98543'; g.strokeStyle = '#4a2a0e'; g.lineWidth = 5; g.beginPath(); g.roundRect(sh.x - sh.w / 2, sh.y - 16, sh.w, 32, 8); g.fill(); g.stroke(); g.fillStyle = '#e8a864'; g.fillRect(sh.x - sh.w / 2 + 6, sh.y - 10, sh.w - 12, 6) }
      for (const b of bullets) { if (b.soft && b.hit) { const f = Math.max(0, 1 - (performance.now() - b.hit) / 900); g.globalAlpha = f; dp(b.position.x, b.position.y + 8, 22, true, 0, 1.7, .55); g.globalAlpha = 1 } else { const p = ip(b); dp(p.x, p.y, (b.R || 20) + 1, b.soft, p.r, 1, 1) } }
      if (aim && state == 'play') {
        const a = getAim(aim); let x = CX + a.ux * 30, y = CY + 30 + a.uy * 30, vx = a.ux * a.sp, vy = a.uy * a.sp;
        for (let i = 0; i < 60; i++) { x += vx; y += vy; vy += .278; if (i % 3 == 2) { g.fillStyle = '#fff'; g.strokeStyle = '#5b3a1a'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill(); g.stroke() } if (y < 0 || y > 1000) break }
      }
      bazooka(); kick *= Math.pow(.85, dtf);
      if (state == 'play' && !aim && performance.now() - last < 9999999 && ammo == queue.length && targets.length && stage == 1 && ammo >= queue.length && score == 0) { g.fillStyle = '#fff'; g.strokeStyle = '#5b3a1a'; g.lineWidth = 6; g.font = '900 28px system-ui,sans-serif'; g.textAlign = 'center'; g.strokeText(tx().hint, 300, 780); g.fillText(tx().hint, 300, 780) }
      for (const f of fly) { g.globalAlpha = Math.min(1, (1 - f.z) * 2); const k = f.px === undefined ? 1 : alpha, fx = f.px === undefined ? f.x : f.px + (f.x - f.px) * k, fy = f.px === undefined ? f.y : f.py + (f.y - f.py) * k, fz = f.px === undefined ? f.z : f.pz + (f.z - f.pz) * k, fa = f.px === undefined ? f.a : f.pa + (f.a - f.pa) * k; dp(fx, fy, 25 * Math.max(0, 1 - fz), false, fa) } g.globalAlpha = 1;
      for (const p of pops) { p.t -= .02 * dtf; const sc = 1 + (1 - p.t) * .4; g.save(); g.translate(p.x, p.y - (1 - p.t) * 60); g.scale(sc, sc); g.globalAlpha = Math.max(0, Math.min(1, p.t * 2)); g.font = '900 34px system-ui,sans-serif'; g.textAlign = 'center'; g.lineWidth = 7; g.strokeStyle = '#5b3a1a'; g.fillStyle = p.c || '#ffd23f'; const q = tx()[p.k] + (p.n ? ' x' + p.n : ''); g.strokeText(q, 0, 0); g.fillText(q, 0, 0); g.restore() }
      pops = pops.filter(p => p.t > 0);
      for (const p of parts) { p.x += p.vx * dtf; p.y += p.vy * dtf; p.vy += .35 * dtf; p.l -= .025 * dtf; g.globalAlpha = Math.max(0, p.l); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r * p.l + 1, 0, 7); g.fill() }
      g.globalAlpha = 1; parts = parts.filter(p => p.l > 0);
      g.setTransform(dpr, 0, 0, dpr, 0, 0); if (flash > .01) { g.fillStyle = 'rgba(255,255,255,' + flash + ')'; g.fillRect(0, 0, W, H); flash *= Math.pow(.78, dtf) }
    }
    let lt = 0, acc = 0, dtf = 1, alpha = 1;
    function ip(b) { const q = b.pp; return q ? { x: q.x + (b.position.x - q.x) * alpha, y: q.y + (b.position.y - q.y) * alpha, a: q.a + (b.angle - q.a) * alpha, r: q.r + ((b.rot || 0) - q.r) * alpha } : { x: b.position.x, y: b.position.y, a: b.angle, r: b.rot || 0 } }
    function snap() { for (const b of bullets) b.pp = { x: b.position.x, y: b.position.y, a: b.angle, r: b.rot || 0 }; for (const b of targets) b.pp = { x: b.position.x, y: b.position.y, a: b.angle, r: 0 }; for (const f of fly) { f.px = f.x; f.py = f.y; f.pa = f.a; f.pz = f.z } }
    function loop(t) {
      requestAnimationFrame(loop); if (!lt) lt = t; const d = Math.min(t - lt, 100); lt = t; dtf = d / 16.667;
      if (eng && (state == 'play' || state == 'clear')) { acc += d; while (acc >= 16.667) { snap(); if (hs > 0) hs--; else step(); acc -= 16.667 } alpha = acc / 16.667 } else { acc = 0; alpha = 1 }
      draw()
    }
    /* ui */
    function hide() { ov.style.display = 'none'; ov.innerHTML = ''; curOv = null }
    function show(fn) { curOv = fn; ov.style.display = 'flex'; ov.innerHTML = fn() }
    function showTitle() { state = 'title'; hud(); show(() => `<h1><span class="a">${tx().t1}</span><span class="b">${tx().t2}</span></h1><button class="bt" id="go">${tx().start}</button>`); document.getElementById('go').onclick = () => { au(); stage = 1; score = 0; shotN = 0; setup() } }
    function showClear() { show(() => `<div class="pn"><h2>${tx().clear}</h2><div>${tx().score}: ${score}</div><button class="bt" id="nx">${tx().nxt}</button></div>`); document.getElementById('nx').onclick = () => { stage++; setup() } }
    function showOver() { show(() => `<div class="pn"><h2>${tx().over}</h2><div>${tx().reach}: ${stage}</div><div>${tx().score}: ${score}</div><button class="bt" id="rt">${tx().retry}</button></div>`); document.getElementById('rt').onclick = () => { stage = 1; score = 0; shotN = 0; setup() } }
    function rebind() {// re-attach handlers after language re-render
      const m = { go: () => { au(); stage = 1; score = 0; shotN = 0; setup() }, nx: () => { stage++; setup() }, rt: () => { stage = 1; score = 0; shotN = 0; setup() } };
      for (const k in m) { const e = document.getElementById(k); if (e) e.onclick = m[k] }
    }
    function setL(l) { L = l; document.documentElement.lang = l; document.title = l == 'ja' ? '運呼バズーカ' : 'POOP LAUNCHER'; bj.className = l == 'ja' ? 'on' : ''; be.className = l == 'en' ? 'on' : ''; if (curOv) { ov.innerHTML = curOv(); rebind() } hud() }
    bj.onclick = () => setL('ja'); be.onclick = () => setL('en');
    /* input */
    const wp = e => { const q = cv.getBoundingClientRect(); return { x: (e.clientX - q.left) / S, y: (e.clientY - q.top) / S } };
    addEventListener('pointerdown', e => { if (e.target.closest('button')) return; au(); if (state != 'play' || ammo <= 0 || performance.now() - last < 350) return; aim = wp(e) });
    addEventListener('pointermove', e => { if (aim) aim = wp(e) });
    addEventListener('pointerup', e => { if (aim) { const p = wp(e); aim = null; if (state == 'play' && ammo > 0) fire(p) } });
    addEventListener('pointercancel', () => aim = null);
    addEventListener('contextmenu', e => e.preventDefault());
    const de = document.documentElement, rf = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rf) fsb.style.display = 'none';
    fsb.onclick = () => { try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { const p = rf.call(de); if (p && p.catch) p.catch(() => { }) } } catch (e) { } };
    eng = Engine.create(); setL(L); showTitle(); requestAnimationFrame(loop);
  </script>
